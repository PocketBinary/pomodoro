<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found · Pomodoro</title>
  <meta name="description" content="The requested page could not be found. Return to Pomodoro Timer.">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">

  <meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <link rel="icon" type="image/png" href="icons/pomodoro.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/pomodoro.png" sizes="180x180">
  <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/tailwind.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="flex min-h-screen flex-col items-center justify-center bg-[#F5F6F8] px-6 py-12 text-slate-900" data-theme="light">
  <main class="w-full max-w-md text-center">
    <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-2xl bg-white shadow-sm ring-1 ring-black/5">
      <img src="icons/pomodoro.png" alt="Pomodoro Logo" width="48" height="48" class="brand-logo" />
    </div>

    <span class="inline-block rounded-full bg-slate-200/70 px-3 py-1 text-xs font-semibold uppercase tracking-wider text-slate-700">
      Error 404
    </span>

    <h1 class="mt-4 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">
      Page not found
    </h1>

    <p class="mt-3 text-sm text-slate-600 sm:text-base">
      The page you are looking for doesn't exist or has been moved.
      <br>
      <span class="text-xs text-slate-400">La page demandée est introuvable ou a été déplacée.</span>
    </p>

    <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">
      <a href="./"
        class="inline-flex min-h-11 items-center justify-center rounded-full bg-slate-900 px-6 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-slate-800 active:scale-[0.98]">
        ← Back to Pomodoro Timer
      </a>
    </div>
  </main>

  <footer class="mt-12 text-center text-xs text-slate-400">
    <p>© 2026 Pomodoro · Created by PocketBinary</p>
  </footer>

  <script>
    // Harmonisation automatique avec le thème système utilisateur
    try {
      const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const savedTheme = localStorage.getItem('pomodoro.theme');
      if (savedTheme === 'dark' || (!savedTheme && isDark)) {
        document.body.setAttribute('data-theme', 'dark');
        document.body.classList.remove('bg-[#F5F6F8]');
        document.body.classList.add('bg-[#0B1120]');
      }
    } catch (e) {
      // Ignoré sans bloquer l'affichage
    }
  </script>
</body>

</html>
